<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <!-- <link rel="stylesheet" href="style.css"> -->
</head>

<body>
  <!-- общая коробка -->
  <div class="calculator">

    <!-- дисплей -->
    <div class="display" id="display">0</div>

    <!-- кнопки ряд-1 -->
    <div class="row">
      <button class="btn btn-gray" id="btn-clear">AC</button>
      <button class="btn btn-gray" id="btn-sign">+/-</button>
      <button class="btn btn-gray" id="btn-percent">%</button>
      <button class="btn btn-orange" id="btn-divide">÷</button>
    </div>

    <!-- кнопки ряд-2 -->
    <div class="row">
      <button class="btn btn-dark" id="btn-7">7</button>
      <button class="btn btn-dark" id="btn-8">8</button>
      <button class="btn btn-dark" id="btn-9">9</button>
      <button class="btn btn-orange" id="btn-multiply">×</button>
    </div>

    <!-- кнопки ряд-3 -->
    <div class="row">
      <button class="btn btn-dark" id="btn-4">4</button>
      <button class="btn btn-dark" id="btn-5">5</button>
      <button class="btn btn-dark" id="btn-6">6</button>
      <button class="btn btn-orange" id="btn-minus">−</button>
    </div>

    <!-- кнопки ряд-4 -->
    <div class="row">
      <button class="btn btn-dark" id="btn-1">1</button>
      <button class="btn btn-dark" id="btn-2">2</button>
      <button class="btn btn-dark" id="btn-3">3</button>
      <button class="btn btn-orange" id="btn-plus">+</button>
    </div>

    <!-- кнопки ряд-5 -->
    <div class="row row-last">
      <button class="btn btn-dark btn-zero" id="btn-0">0</button>
      <button class="btn btn-dark" id="btn-dot">,</button>
      <button class="btn btn-orange" id="btn-equals">=</button>
    </div>

  </div>

  <script src="index.js"></script>
</body>

</html>
